name: Auto update site

# 触发条件：source/ 目录有新文件提交，或手动运行
on:
  workflow_dispatch:
  push:
    paths:
      - 'source/**'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pymupdf

      - name: Run site updater
        run: |
          python3 tools/update_site.py --all --source source/ || echo "::warning::source/ 下未找到可更新的文件（需要 .xlsx / .zip / .pdf）"

      - name: Commit and push changes
        run: |
          git config user.name "marvis-bot"
          git config user.email "marvis-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No content changes, skip commit"
          else
            git commit -m "auto: 依据 source/ 新文件更新网站内容"
            git push
          fi
